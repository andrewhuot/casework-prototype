regulation`,added:`2026-02-03`,usedFor:[`A1`,`A2`,`A3`,`A4`],heading:`Chapter 7, Article 3. Accessory dwelling units`,sections:[{label:`§ADU-1`,text:`Eligibility. One accessory dwelling unit is permitted on a lot in the T3 and T4 transect zones that contains one principal single-family residence. No more than one accessory dwelling unit may exist on a lot.`},{label:`§ADU-2`,text:`Unit size. The floor area of an accessory dwelling unit shall not exceed 800 square feet, measured to the exterior face of the walls.`},{label:`§ADU-3`,text:`Setbacks. A detached accessory dwelling unit shall be set back at least 5 feet from the side and rear lot lines. An administrative waiver of up to 1 foot may be requested where the affected neighbouring owner consents in writing.`},{label:`§ADU-4`,text:`Parking. No additional parking space is required for an accessory dwelling unit.`},{label:`§ADU-5`,text:`Owner occupancy. The owner shall occupy either the principal residence or the accessory dwelling unit. A notarised owner-occupancy affidavit shall be filed with the application and recorded before a certificate of occupancy is issued.`}]},{id:`R2`,name:`Florida Building Code: rooftop solar (excerpt)`,type:`regulation`,added:`2026-02-03`,usedFor:[`S2`,`S3`,`S4`,`S5`],heading:`Section RS. Rooftop photovoltaic systems on one- and two-family dwellings`,sections:[{label:`§RS-1`,text:`Scope. This section applies to roof-mounted photovoltaic systems on one- and two-family dwellings.`},{label:`§RS-2`,text:`Fire classification. Modules shall be listed with the roof assembly for the fire class required for the roof.`},{label:`§RS-3`,text:`Roof access pathways. A pathway not less than 36 inches wide shall be provided from the eave to the ridge on each roof plane that carries modules. Modules shall be set back not less than 18 inches from the ridge on both sides of the ridge.`},{label:`§RS-4`,text:`Loads. Roof structure shall carry the dead load of the array in addition to the design loads for the roof.`},{label:`§RS-5`,text:`Wind load. In the High-Velocity Hurricane Zone, module attachment shall be designed for the design wind speed at the site, and the design shall be signed and sealed by a Florida-registered engineer.`},{label:`§RS-6`,text:`Electrical diagram. The permit set shall include a single-line diagram that shows the array, the inverter, the AC disconnect, and the rating of the main service panel and of the backfeed breaker.`},{label:`§RS-7`,text:`Equipment listing. Modules shall be listed to UL 61730 and inverters to UL 1741. The listing shall be stated on the specification sheet submitted with the application.`}]},{id:`R3`,name:`Floodplain ordinance (excerpt)`,type:`regulation`,added:`2026-02-10`,usedFor:[`A5`],heading:`Chapter 11. Flood damage prevention`,sections:[{label:`§FP-1`,text:`Applicability. This chapter applies to new construction and substantial improvements within a special flood hazard area.`},{label:`§FP-2`,text:`Elevation certificate. An elevation certificate on the current FEMA form, completed by a licensed surveyor or engineer, shall be submitted with the permit application for any new habitable structure.`},{label:`§FP-3`,text:`Base flood elevation. The base flood elevation is taken from the flood insurance rate map in effect on the date of application.`},{label:`§FP-4`,text:`Finished floor. The lowest finished floor of new residential construction, including an accessory dwelling unit, shall be at least 1 foot above the base flood elevation, as shown on the elevation certificate.`}]},{id:`R4`,name:`Building Department plan review checklist, 2026`,type:`internal_manual`,added:`2026-03-02`,usedFor:[`S1`,`X1`,`X2`],heading:`Residential plan review checklist, 2026 edition`,sections:[{label:`Item 1`,text:`Consistency. Confirm that the owner, the parcel number, and the property address match across the application form and every attached document.`},{label:`Item 2`,text:`Contractor licence. Record the Florida licence number for each contractor and check that the expiry date is after the application date.`},{label:`Item 3`,text:`Scope. Confirm that the scope of work on the application matches the drawings.`},{label:`Item 4`,text:`Fees. Confirm that plan review fees are paid before review begins.`},{label:`Item 5`,text:`Site plan. Confirm setbacks and lot coverage against the zoning code.`},{label:`Item 6`,text:`Structural. Route to structural review where the scope requires it.`},{label:`Item 7`,text:`Flood. Confirm the elevation certificate where the parcel lies in a flood zone.`},{label:`Item 8`,text:`Fire. Confirm roof access pathways for rooftop equipment.`},{label:`Item 9`,text:`Electrical capacity. Where one application adds load and generation together, confirm that the main service panel can carry the added load and the backfeed breaker within its rating, or that a panel upgrade is included in the scope of work.`}]},{id:`R5`,name:`Closed cases 2024 to 2025 (1,200 decisions)`,type:`prior_decisions`,added:`2026-03-16`,usedFor:`precedents`,sections:[]},{id:`R6`,name:`Fire Marshal bulletin 2026-03: rooftop access pathways`,type:`regulation`,added:`2026-09-21`,usedFor:[`S2`],heading:`Fire Marshal bulletin 2026-03. Rooftop access pathways for photovoltaic arrays`,link:`https://example.com/fire-marshal/bulletins/2026-03`,hiddenOnLoad:!0,sections:[{label:`§1`,text:`Purpose. This bulletin updates the ridge setback guidance for rooftop photovoltaic arrays following the 2025 review of roof ventilation during structure fires.`},{label:`§2`,text:`Ridge setback. A pathway not less than 36 inches wide shall be provided from the eave to the ridge. The ridge setback shall be 18 inches, or 36 inches where the array covers more than 33 percent of the roof plane, so that crews can open the roof for ventilation.`},{label:`§3`,text:`Effect. This bulletin applies to applications filed on or after its adoption by the Building Department. Applications already filed are reviewed under the rules in effect on t Thank you for your application MIA-2026-1187 for an accessory dwelling unit and rooftop solar at 412 Palmetto Court. We have reviewed your documents and need two items before we can continue:

1. Elevation certificate (Floodplain ordinance §FP-4). It shows the height of the new unit's floor above the base flood level, which must be at least 1 foot. A licensed surveyor can prepare it, and the surveyor who did your boundary survey can usually add it.

2. Electrical panel upgrade or a revised load calculation (Plan review checklist item 9). Your main panel is 150 A. The new unit adds 48 A and the solar system feeds back 40 A, which is more than the panel can carry. Your contractor, Sunward Electric LLC, can add a panel upgrade to the scope of work or send a corrected calculation.

Your site plan lists a rear setback of 5 ft 0 in, but the survey shows 4 ft 6 in. [Reviewer to decide: invite an administrative waiver request, or require a revised site plan.]

Please reply by 5 Oct 2026 through the applicant portal or by email to permits@example.com. Call (305) 555-0100 if you have questions.

Building Department, City of Miami`,letterSpanish:`Estimada Maria Delgado:

Gracias por su solicitud MIA-2026-1187 para una unidad de vivienda accesoria y paneles solares en el techo en 412 Palmetto Court. Hemos revisado sus documentos y necesitamos dos cosas antes de continuar:

1. Certificado de elevación (Ordenanza de zonas inundables §FP-4). Indica la altura del piso de la nueva unidad sobre el nivel base de inundación, que debe ser de al menos 1 pie. Puede prepararlo un agrimensor con licencia, y por lo general el mismo agrimensor que hizo su levantamiento de linderos puede añadirlo.

2. Ampliación del panel eléctrico o un cálculo de carga corregido (Lista de revisión de planos, punto 9). Su panel principal es de 150 A. La nueva unidad añade 48 A y el sistema solar aporta otros 40 A de retorno, más de lo que el panel puede soportar. Su contratista, Sunward Electric LLC, puede incluir la ampliación del panel en el alcance de la obra o enviar un cálculo corregido.

Su plano del sitio indica un retiro trasero de 5 pies 0 pulgadas, pero el levantamiento muestra 4 pies 6 pulgadas. [Decisión del revisor: invitar a solicitar una exención administrativa, o exigir un plano del sitio revisado.]

Responda antes del 5 de octubre de 2026 a través del portal de solicitantes o por correo electrónico a permits@example.com. Si tiene preguntas, llame al (305) 555-0100.

s to quote both and not guess. Three similar encroachments were approved with a waiver and one was denied after a neighbour objected.`,quote:{document:`Boundary survey`,text:`Proposed ADU footprint is 4 ft 6 in from the rear lot line`}},{question:`What would a panel upgrade need to show?`,answer:`A revised single-line diagram with a 200 A main panel, or a load calculation showing the existing house load plus 48 A and the 40 A backfeed within 150 A. In the closest past decision, P-2025-0418, the applicant upgraded to 200 A and the permit was issued.`,quote:{document:`ADU electrical load calculation`,text:`No service upgrade is included in this scope.`}},{question:`Does the contractor’s licence cover both projects?`,answer:`Sunward Electric LLC holds electrical licence EC13009999, which covers the electrical work for the ADU and the solar array and expires after the application date. The form names no building contractor for the ADU structure itself. That is outside the twelve criteria but worth a note to the applicant.`,quote:{document:`Combined application form`,text:`Licence: EC13009999`}}],"MIA-2026-1142":[{question:`Is there room on the panel for this backfeed?`,answer:`Yes. A 200 A main panel with a 30 A backfeed breaker sits within the usual 120 percent bus limit, and the application adds no new load.`,quote:{document:`Solar single-line diagram notes`,text:`Main service panel: 200 A, with a 30 A solar backfeed breaker`}},{question:`Who sealed the wind load letter?`,answer:`M. Oduya, PE 55502, on 2 Sep 2026, for the High-Velocity Hurricane Zone at a 175 mph design wind speed.`,quote:{document:`Solar equipment and structural`,text:`Signed and sealed by M. Oduya, PE 55502, 2 Sep 2026`}},{question:`Does anything need a follow-up after approval?`,answer:`No documents are missing. The inspection will confirm the pathway and the ridge setback on the roof as drawn.`,quote:{document:`Solar equipment and structural`,text:`36 in pathway from eave to ridge on the east side of the array.`}}],"MIA-2026-1156":[{question:`How far above base flood elevation is the floor?`,answer:`1.6 ft. The certificate shows the lowest finished floor at 9.6 ft NAVD against a base flood elevation of 8.0 ft NAVD, above the 1 ft minimum in §FP-4.`,quote:{document:`Elevation certificate`,text:`Lowest finished floor: 9.6 ft NAVD`}},{question:`Is the affidavit notarised?`,answer:`Yes. It was sworn before a notary on 12 Sep 2026, three days before the application was filed.`,quote:{document:`Owner-occupancy affidavit`,text:`Sworn to and subscribed before me on 12 Sep 2026 by Grace Kim.`}},{question:`Do the setbacks leave margin?`,answer:`Yes. The rear setback is 10 ft 0 in and the side is 7 ft 6 in, both well above the 5 ft minimum, and the survey agrees with the site plan.`,quote:{document:`ADU site plan notes`,text:`Rear setback: 10 ft 0 in`}}],"MIA-2026-1149":[{question:`What exactly is missing?`,answer:`The signed and sealed wind load letter for the High-Velocity Hurricane Zone. The roof plan says the attachment letter will follow under separate cover, but it has not arrived in the 21 days since filing.`,quote:{document:`Roof plan`,text:`Structural attachment letter to follow under separate cover.`}},{question:`Who can provide the wind load letter?`,answer:`A Florida-registered engineer must sign and seal it. Meridian Solar Co. normally arranges this through their engineer, so the request should go to the applicant with the contractor named.`,quote:{document:`Permit application: rooftop solar`,text:`Contractor: Meridian Solar Co.`}},{question:`Is the rest of the packet in order?`,answer:`Yes. The licence is current, the pathways and ridge setback meet §RS-3, the single-line diagram is complete, and both spec sheets state UL listings.`,quote:{document:`Solar single-line diagram notes`,text:`Main service panel: 200 A, with a 45 A solar backfeed breaker`}}],"MIA-2026-1163":[{question:`When did the licence expire?`,answer:`On 31 Aug 2026, a week before the application was filed on 7 Sep 2026. Checklist item 2 requires the expiry date to be after the application date.`,quote:{document:`Combined application form`,text:`Licence expires: 31 Aug 2026`}},{question:`What was the first request about?`,answer:`The roof plan, which was missing from the original packet. It was resubmitted on 17 Sep 2026 and meets §RS-3. This letter would be the second request, so it should cover everything that is still open.`,quote:{document:`Solar equipment and structural`,text:`36 in pathway from eave to ridge. Ridge setback: 18 in`}},{question:`Does the panel carry the combined load?`,answer:`Yes. The 200 A panel carries 40 A of new ADU load with a 30 A backfeed, unlike the Delgado case on a 150 A panel.`,quote:{document:`ADU electrical load calculation`,text:`Added load: 40 A`}}],"MIA-2026-1171":[{question:`How much over the limit is the unit?`,answer:`60 sq ft. The ADU is 860 sq ft against the 800 sq ft limit in §ADU-2.`,quote:{document:`ADU site plan notes`,text:`ADU floor area: 860 sq ft`}},{question:`What happened in the similar past case?`,answer:`P-2025-0209, a 910 sq ft ADU, was denied because the lot could fit a conforming unit. The hardship here is different: an accessible bathroom and bedroom for a family member who uses a wheelchair.`,quote:{document:`Variance request letter`,text:`The extra 60 sq ft gives my mother, who uses a wheelchair, an accessible bathroom and bedroom.`}},{question:`Is everything else met?`,answer:`Yes. Zoning, setbacks, the affidavit, and the elevation certificate are all in order, so the variance is the only open question.`,quote:{document:`Elevation certificate`,text:`Lowest finished floor: 8.4 ft NAVD`}}],"MIA-2026-1178":[{question:`Which document is right about the ridge setback?`,answer:`They conflict. The roof plan shows 18 in and the installer notes say 14 in to fit a third string. The notes are the more recent field information, so the drawing may be out of date.`,quote:{document:`Installer notes`,text:`Modules run to 14 in below the ridge to fit the third string.`}},{question:`What happened last time this came up?`,answer:`In P-2025-0366 the array was redrawn with an 18 in setback and one fewer module, and the permit was issued after resubmission.`,quote:{document:`Roof plan`,text:`Ridge setback: 18 in`}},{question:`Is the electrical side in order?`,answer:`Yes. The 200 A panel with a 35 A backfeed, the inverter, and the disconnect are all shown, and both spec sheets state UL listings.`,quote:{document:`Solar single-line diagram notes`,text:`Main service panel: 200 A, with a 35 A solar backfeed breaker`}}]},Bl={block:`_block_11r97_1`,heading:`_heading_11r97_10`,list:`_list_11r97_19`,item:`_item_11r97_25`,itemOpen:`_itemOpen_11r97_31`,question:`_question_11r97_35`,answer:`_answer_11r97_55`,reveal:`_reveal_11r97_1`,quote:`_quote_11r97_64`,quoteIcon:`_quoteIcon_11r97_77`,quoteSource:`_quoteSource_11r97_83`,freeform:`_freeform_11r97_90`,freeformLabel:`_freeformLabel_11r97_97`,input:`_input_11r97_103`,note:`_note_11r97_113`};function Vl({caseId:e}){let t=zl[e]??[],[n,r]=(0,x.useState)(null);return t.length===0?null:(0,L.jsxs)(`section`,{className:Bl.block,"aria-labelledby":`ask-heading`,"data-ask-about":!0,children:[(0,L.jsxs)(`h3`,{id:`ask-heading`,className:Bl.heading,children:[(0,L.jsx)(Xa,{size:15,"aria-hidden":!0}),`Ask about this case`]}),(0,L.jsx)(`ul`,{className:Bl.list,children:t.map((e,t)=>{let i=n===t;return(0,L.jsxs)(`li`,{className:I(Bl.item,i&&Bl.itemOpen),children:[(0,L.jsx)(`button`,{type:`button`,className:Bl.question,"aria-expanded":i,onClick:()=>r(i?null:t),children:e.question}),i&&(0,L.jsxs)(`div`,{className:Bl.answer,children:[(0,L.jsx)(`p`,{children:e.answer}),(0,L.jsxs)(`blockquote`,{className:Bl.quote,children:[(0,L.jsx)(no,{size:12,"aria-hidden":!0,className:Bl.quoteIcon}),(0,L.jsxs)(`span`,{children:[`“`,e.quote.text,`” `,(0,L.jsx)(`span`,{className:Bl.quoteSource,children:e.quote.document})]})]})]})]},e.question)})}),(0,L.jsxs)(`div`,{class
